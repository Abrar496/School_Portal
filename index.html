<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6750A4">
<title>Class board</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root { --p:#6750A4; --bg:#fbf8ff; --ink:#1d1b20; --mute:#6f6a78; --red:#c62828; --green:#2e7d32; --amber:#ef6c00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--p); color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  .logo { width:38px; height:38px; border-radius:10px; background:#fff; color:var(--p); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; }
  header h1 { margin:0; font-size:17px; } header .sub { font-size:12px; opacity:.85; } .grow { flex:1; }
  button { font:inherit; cursor:pointer; }
  .pill { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:999px; padding:6px 12px; font-size:13px; }
  main { max-width:720px; margin:0 auto; padding:10px 12px 90px; }
  .tabs, .chips { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .chip { border:1px solid #cfc8dc; background:#fff; color:var(--ink); border-radius:999px; padding:7px 14px; font-size:14px; }
  .chip.on { background:#e8def8; border-color:var(--p); color:#3b2a73; font-weight:600; }
  .card { background:#fff; border-radius:14px; padding:14px; margin:10px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card.done { opacity:.55; } .card.alert { background:#ffebee; border:1px solid var(--red); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .badge { font-size:12px; padding:3px 9px; border-radius:999px; color:#fff; }
  .HOMEWORK { background:#1565c0; } .NOTICE { background:#6a1b9a; } .FOLLOWUP { background:#ef6c00; } .MESSAGE { background:#00897b; }
  .subj { font-size:12px; background:#eee; border-radius:999px; padding:3px 9px; }
  .title { font-size:17px; font-weight:600; margin:8px 0 4px; }
  .body { white-space:pre-wrap; word-break:break-word; line-height:1.45; }
  .meta { color:var(--mute); font-size:12px; margin-top:8px; display:flex; gap:10px; flex-wrap:wrap; }
  .due { font-weight:600; } .due.soon { color:var(--amber); } .due.late { color:var(--red); }
  .big { font-size:40px; font-weight:700; line-height:1; } .bad { color:var(--red); } .good { color:var(--green); }
  .stats { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; } .stats div { min-width:70px; } .stats b { display:block; font-size:20px; } .stats span { font-size:12px; color:var(--mute); }
  .empty, .note { text-align:center; color:var(--mute); padding:24px 10px; } .error { color:var(--red); text-align:center; padding:10px; }
  .actions { display:flex; gap:10px; margin-top:10px; }
  .btn { background:var(--p); color:#fff; border:0; border-radius:10px; padding:10px 16px; } .btn.alt { background:#fff; color:var(--p); border:1px solid var(--p); } .btn.red { background:#fff; color:var(--red); border:1px solid var(--red); }
  label { display:block; font-size:13px; color:var(--mute); margin:10px 0 4px; }
  input, select, textarea { width:100%; font:inherit; padding:10px; border:1px solid #cfc8dc; border-radius:10px; background:#fff; } textarea { min-height:80px; }
  footer { text-align:center; color:var(--mute); font-size:12px; padding:18px 10px 30px; }
  .refresh { position:fixed; right:16px; bottom:16px; background:var(--p); color:#fff; border:0; border-radius:999px; padding:12px 18px; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  a { color:#1a5fb4; }
  .cal-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; margin-top:8px; }
  .cal-head { font-size:11px; font-weight:600; color:var(--mute); padding:4px 0; }
  .cal-cell { border-radius:8px; padding:4px 2px; min-height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fafafa; border:1px solid #e8e3f0; }
  .cal-cell.empty { background:transparent; border-color:transparent; }
  .cal-cell .cal-d { font-size:11px; font-weight:600; color:var(--ink); margin-bottom:2px; }
  .cal-cell .cal-m { font-size:11px; font-weight:700; border-radius:4px; padding:1px 5px; }
  .cal-cell.P { background:#e8f5e9; border-color:#a5d6a7; } .cal-cell.P .cal-m { background:#2e7d32; color:#fff; }
  .cal-cell.A { background:#ffebee; border-color:#ef9a9a; } .cal-cell.A .cal-m { background:#c62828; color:#fff; }
  .cal-cell.L { background:#fffde7; border-color:#fff59d; } .cal-cell.L .cal-m { background:#fbc02d; color:#212121; }
  .cal-cell.off { background:#f5f5f5; border-color:#e0e0e0; opacity:.85; } .cal-cell.off .cal-m { font-size:10px; color:#757575; font-weight:normal; }
  .cal-cell .cal-dot { width:4px; height:4px; border-radius:50%; background:#d0c8dc; }
  .cal-tag { display:inline-block; border-radius:4px; padding:1px 6px; font-weight:700; font-size:11px; }
  .cal-tag.P { background:#2e7d32; color:#fff; } .cal-tag.A { background:#c62828; color:#fff; } .cal-tag.L { background:#fbc02d; color:#212121; } .cal-tag.off { background:#9e9e9e; color:#fff; }
  .extra-fine-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #ffd8d8; }
  .extra-fine-row:last-child { border-bottom:0; }
  header { background: linear-gradient(135deg, #4a148c 0%, #6750A4 100%); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; box-shadow: 0 3px 12px rgba(74, 20, 140, 0.22); }
  .fine-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
  .fine-box { background: #faf8fc; border: 1px solid #e7e0ec; border-radius: 10px; padding: 8px; text-align: center; }
  .fine-box.total { background: #ffebee; border-color: #ffcdd2; }
  .fine-box b { display: block; font-size: 18px; margin-bottom: 2px; }
  .fine-box span { font-size: 11px; color: var(--mute); line-height: 1.2; }
</style>
</head>

}

  const re = /(https?:\/\/[^\s<>"']+)/g; let last = 0, m;
  while ((m = re.exec(text))) { if (m.index > last) parent.append(text.slice(last, m.index)); parent.append(h("a", { href: m[1], target: "_blank", rel: "noopener noreferrer" }, m[1])); last = m.index + m[1].length; }
  if (last < text.length) parent.append(text.slice(last));
}

// ------------------------------------------------------------------ network ----
async function api(url, opt) {
  if (url.includes("PASTE_YOUR_APPS_SCRIPT_URL_HERE")) throw new Error("Server URL not configured in index.html");
  const r = await fetch(url, opt);
  let j;
  try { j = await r.json(); } catch (err) { throw new Error("Server error " + r.status); }
  if (!j.ok) throw new Error(j.error || "Server error");
  return j;
}

const get = action => api(API + "?" + new URLSearchParams(Object.assign({ action }, authParams())).toString());

async function loadAll() {
  if (!auth) { render(); return; }
  setMsg(t("loading"), "note");
  try {
    feed = await get("feed"); localStorage.setItem("board_cache_" + key(), JSON.stringify(feed));
    if (auth.role === "S") { try { att = await get("attendanceMine"); localStorage.setItem("board_att_" + key(), JSON.stringify(att)); } catch (e) { att = null; } }
    if (auth.role === "T") { try { await loadExtraFines(); } catch (e) {} }
    setMsg("", "");
  } catch (e) {
    if (/log in|valid|Unknown/.test(String(e.message))) { logout(); setMsg(String(e.message), "error"); return; }
    try { feed = JSON.parse(localStorage.getItem("board_cache_" + key()) || "null"); att = JSON.parse(localStorage.getItem("board_att_" + key()) || "null"); } catch (x) {}
    setMsg(feed ? t("offline") : String(e.message || "No internet"), feed ? "note" : "error");

  render();
}
function setMsg(text, cls) { const m = $("msg"); m.textContent = text; m.className = cls || ""; }
function logout() { localStorage.removeItem("board_auth"); auth = null; feed = null; att = null; render(); }

// ------------------------------------------------------------------ screens ----
function render() {
  document.documentElement.lang = lang;
  $("title").textContent = t("collegeTitle"); $("lang").textContent = lang === "en" ? "বাংলা" : "English";
  $("credit").textContent = CREDIT; $("out").textContent = t("logout"); $("out").hidden = !auth; $("refresh").hidden = !auth;
  const userTag = auth && feed ? (auth.role === "T" ? t("teacher") : feed.name || (t("roll") + " " + feed.roll)) : "";
  $("sub").textContent = [t("classSecTitle"), userTag].filter(Boolean).join(" · ");
  const v = $("view"); v.textContent = "";
  if (!auth) { v.append(loginView()); return; }
  if (!feed) return;
  const tabs = [["board", t("board_t")]].concat(auth.role === "S" ? [["att", t("att")]] : [["markAtt", t("markAttTab")], ["punish", t("punishTab")], ["me", t("myLogin")]]);

  if (tab === "board") v.append(boardView()); else if (tab === "att") v.append(attView()); else if (tab === "markAtt") v.append(markAttView()); else if (tab === "punish") v.append(punishView()); else v.append(profileView());
}

  const err = h("div", { class: "error", id: "login-err" });
  const secList = sections.length ? sections : ["XI-B"];

// ------------------------------------------------------------------ attendance and fine (worked out here from the published marks) ----
const WEEKENDS = { FRI_SAT: [5, 6], SAT_SUN: [6, 0], SUN: [0], FRI: [5] };
function analyse(a) {
  const info = a.info || {}, hol = new Set(info.holidays || []), wk = WEEKENDS[info.weekend] || [5, 6], rate = Number(info.fine) || 50, today = nowDate();
  const pad = n => String(n).padStart(2, "0"), all = [];
  const months = a.months.map(m => {
    const [y, mo] = m.month.split("-").map(Number), days = new Date(y, mo, 0).getDate();
    let P = 0, A = 0, L = 0, last = 0; const absentDays = [];
    const daysList = [];
    for (let d = 1; d <= days; d++) {
      const c = (m.marks[d - 1] || " ");
      const dtStr = y + "-" + pad(mo) + "-" + pad(d);
      const wd = new Date(y, mo - 1, d).getDay();
      const isOff = wk.includes(wd) || hol.has(dtStr);
      // Holidays and weekends: do not count P or A even if pressed wrongly!
      if (!isOff) {
        if (c === "P") P++;
        else if (c === "A") { A++; absentDays.push(d); }
        else if (c === "L") L++;
        if (c !== " ") { last = d; all.push(c); }
      }
      daysList.push({ d, wd, mark: c, isOff, isHoliday: hol.has(dtStr), isWeekend: wk.includes(wd) });
    }
    const ended = new Date(y, mo, 0, 23, 59) < today;
    const isCurrentMonth = today.getFullYear() === y && (today.getMonth() + 1) === mo;
    const upTo = ended ? days : (isCurrentMonth ? Math.max(last, today.getDate()) : last);
    let worked = 0;
    for (let d = 1; d <= upTo; d++) {
      const wd = new Date(y, mo - 1, d).getDay();
      const dtStr = y + "-" + pad(mo) + "-" + pad(d);
      if (!wk.includes(wd) && !hol.has(dtStr)) worked++;
    }
    return { month: m.month, y, mo, P, A, L, worked, pct: worked ? Math.min(100, Math.floor(P * 100 / worked)) : 0, absentDays, fine: A * rate, daysList };
  });
  const P = months.reduce((s, m) => s + m.P, 0), A = months.reduce((s, m) => s + m.A, 0), L = months.reduce((s, m) => s + m.L, 0), worked = months.reduce((s, m) => s + m.worked, 0);
  let streak = 0; for (let i = all.length - 1; i >= 0; i--) { if (all[i] === "A") streak++; else break; }
  const cur = months.length ? months[months.length - 1] : null;
  const thisMonthFine = cur ? cur.fine : 0;
  const prevMonthsFine = months.slice(0, -1).reduce((s, m) => s + m.fine, 0);
  const extraFines = a.extraFines || [];
  const extraTotal = extraFines.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const grandTotalFine = thisMonthFine + prevMonthsFine + extraTotal;
  return { months, P, A, L, worked, pct: worked ? Math.min(100, Math.floor(P * 100 / worked)) : 0, fine: A * rate, thisFine: thisMonthFine, prevFine: prevMonthsFine, rate, streak, extraFines, extraTotal, grandFine: grandTotalFine };
}

          h("div", { class: "meta" }, (ef.cause || "") + " · " + (ef.date || ""))
        ),
        h("button", { class: "btn alt red", style: "padding:4px 10px;font-size:12px;", onclick: async () => {
          if (!confirm(t("sure"))) return;
          try {
            const res = await post({ action: "extraFine", subAction: "delete", index: idx });
            if (res.ok) { teacherExtraFines = res.extraFines || []; render(); }
          } catch (e) { alert(String(e.message || e)); }
        } }, t("del"))
      );
      listCard.append(row);
    });
  }
  wrap.append(listCard);
  return wrap;
}


let markAttDate = new Date().toISOString().slice(0, 10);
let markAttMap = {}; // roll -> 'P' / 'A' / 'L'
let teacherRoster = [];
let rosterLoaded = false;

async function loadTeacherRoster() {
  try {
    const res = await get("roster");
    if (res.ok) {
      teacherRoster = res.roster || [];
      rosterLoaded = true;
    }
  } catch (e) {}
}

function markAttView() {
  if (!rosterLoaded) {
    loadTeacherRoster().then(() => render());
  }
  const wrap = h("div");
  const card = h("div", { class: "card" });
  card.append(h("div", { class: "title" }, "✍ " + t("markAttTab")));
  card.append(h("div", { class: "meta", style: "margin-bottom:12px;" }, t("cls") + " " + (feed ? feed.section : "") + " · " + (teacherRoster.length ? teacherRoster.length + " " + t("student") : "")));

  const dateInp = h("input", {
    type: "date",
    value: markAttDate,
    style: "font-weight:600; margin-bottom:10px;",
    onchange: (e) => { markAttDate = e.target.value; render(); }
  });

  const allPBtn = h("button", {
    class: "btn alt",
    type: "button",
    style: "margin-bottom:12px; width:100%; font-weight:600;",
    onclick: () => {
      teacherRoster.forEach(s => { markAttMap[s.roll] = "P"; });
      render();
    }
  }, "✔ " + t("markAllP"));

  card.append(h("label", {}, t("dueDate")), dateInp, allPBtn);

  const listWrap = h("div", { style: "display:flex; flex-direction:column; gap:6px;" });
  if (!teacherRoster.length) {
    listWrap.append(h("div", { class: "note" }, t("loading")));
  } else {
    teacherRoster.forEach(s => {
      const cur = markAttMap[s.roll] || "";
      const row = h("div", {
        style: "display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:#fafafa; border-radius:8px; border:1px solid #eee;"
      },
        h("div", { style: "font-size:14px;" }, h("b", {}, s.roll), "  " + s.name),
        h("div", { style: "display:flex; gap:4px;" },
          ["P", "A", "L"].map(m => {
            const isSel = cur === m;
            const bg = isSel ? (m === "P" ? "#2e7d32" : m === "A" ? "#c62828" : "#fbc02d") : "#fff";
            const col = isSel ? (m === "L" ? "#000" : "#fff") : "#333";
            const bdr = isSel ? "transparent" : "#ccc";
            return h("button", {
              class: "pill",
              style: "min-width:34px; padding:4px 8px; font-weight:700; background:" + bg + "; color:" + col + "; border:1px solid " + bdr + "; cursor:pointer;",
              onclick: () => { markAttMap[s.roll] = m; render(); }
            }, m);
          })
        )
      );
      listWrap.append(row);
    });
  }

  card.append(listWrap);

  const st = h("div", { class: "note", id: "ma-status", style: "margin-top:10px;" });
  const saveBtn = h("button", {
    class: "btn",
    style: "margin-top:14px; width:100%; font-weight:700; font-size:15px; padding:12px;",
    onclick: async () => {
      if (!teacherRoster.length) return;
      saveBtn.disabled = true;
      st.textContent = t("loading");
      try {
        const res = await post({ action: "markDay", date: markAttDate, marks: markAttMap });
        if (res.ok) {
          st.textContent = "✔ " + t("attSavedOk") + " (" + res.saved + " " + t("student") + ")";
          await loadAll();
        }
      } catch (e) {
        st.textContent = String(e.message || e);
      }
      saveBtn.disabled = false;
    }
  }, t("saveAtt"));

  card.append(saveBtn, st);
  wrap.append(card);
  return wrap;
}

function profileView() {
  const f = k => h("input", { id: "p-" + k, type: k.includes("Pw") ? "password" : "text" }), id = f("id"), mob = f("mob"), oldp = f("oldPw"), newp = f("newPw"), st = h("div", { class: "note", id: "p-status" });
  return h("div", { class: "card" }, h("div", { class: "title" }, t("myLogin")), h("label", {}, t("newId")), id, h("label", {}, t("mob")), mob, h("label", {}, t("oldPw")), oldp, h("label", {}, t("newPw")), newp,
    h("div", { class: "actions" }, h("button", { class: "btn", id: "p-save", onclick: async () => {
      try { const j = await post({ action: "profile", newLoginId: id.value, mobile: mob.value || undefined, oldPassword: oldp.value, newPassword: newp.value });
        auth.u = j.teacher.loginId; auth.tk = j.tk; save(); st.textContent = t("saved"); } catch (e) { st.textContent = String(e.message || e); } } }, t("save"))), st);
}

// ------------------------------------------------------------------ start ----
$("lang").onclick = () => { lang = lang === "en" ? "bn" : "en"; localStorage.setItem("board_lang", lang); render(); };
$("out").onclick = logout; $("refresh").onclick = loadAll;
async function start() {
  try { auth = JSON.parse(localStorage.getItem("board_auth") || "null"); } catch (e) { auth = null; }
  if (auth) { try { feed = JSON.parse(localStorage.getItem("board_cache_" + key()) || "null"); att = JSON.parse(localStorage.getItem("board_att_" + key()) || "null"); } catch (e) {} }
  render();
  if (!auth) { try { const sc = (await api(API + "?action=sections")).sections; if (sc && sc.length) { sections = sc; localStorage.setItem("board_sections", JSON.stringify(sc)); } } catch (e) { setMsg(String(e.message || "No internet"), "error"); } render(); }
  else loadAll();
}
start();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
